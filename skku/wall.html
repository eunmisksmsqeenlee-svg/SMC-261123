<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>올해의 한마디 · 메시지월</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="common.css?v=20261007r">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* 대형 화면: 왼쪽 위 제목, 오른쪽 위 QR, 쪽지는 아래에서 떠올라 가운데에서 떠다녀요 */
:root{--gutter:clamp(16px,3vw,48px)}
html,body{height:100%;overflow:hidden}
body.idle,body.idle *{cursor:none}

.stage{position:fixed;inset:0;overflow:hidden;background:var(--sky-bg)}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;z-index:2}

.masthead{
  position:absolute;z-index:3;pointer-events:none;
  top:calc(env(safe-area-inset-top,0px) + var(--gutter));left:var(--gutter);
  max-width:min(960px,56%);display:grid;gap:clamp(6px,.6vw,12px);
}
.masthead .eyebrow{font-size:clamp(11px,.85vw,15px)}
.title{margin:0;font:700 clamp(30px,4.4vw,78px)/1.1 var(--f-display);color:var(--paper);text-wrap:balance}
.sub{margin:0;font:400 clamp(13px,1.1vw,20px)/1.5 var(--f-ui);color:var(--mist)}

.qr{
  position:absolute;z-index:3;
  top:calc(env(safe-area-inset-top,0px) + var(--gutter));right:var(--gutter);
  display:grid;justify-items:center;gap:clamp(6px,.5vw,10px);
  padding:clamp(8px,.8vw,14px);background:#ffffff;border-radius:10px;
  box-shadow:0 0 0 1px var(--line),0 12px 40px var(--shadow),0 0 60px var(--halo);
  transition:opacity .6s ease,visibility .6s;
}
.masthead .brand-row{font-size:clamp(11px,.85vw,15px)}
.theme-smc .masthead .brand-row{font-size:clamp(13px,1.15vw,22px)}

/* 오른쪽 아래 슬로건 로고 */
.corner-logo{
  position:absolute;z-index:3;right:var(--gutter);
  bottom:calc(env(safe-area-inset-bottom,0px) + clamp(40px,3.6vw,64px));
  font-size:clamp(14px,1.5vw,28px);padding:.45em .8em;border-radius:10px;
  box-shadow:0 0 0 1px var(--line),0 10px 30px var(--shadow);
}
.corner-logo img{height:1.9em;max-width:11em}
.qr canvas{display:block;width:var(--qr-w,clamp(80px,9vw,170px));height:auto;aspect-ratio:1;max-width:100%}
.qr span{font:600 var(--qr-label,clamp(10px,.8vw,15px))/1.2 var(--f-ui);color:var(--ink);letter-spacing:.04em}
.qr .qr-fallback{max-width:var(--qr-w,clamp(80px,9vw,170px));font:500 11px/1.4 var(--f-ui);color:var(--ink);word-break:break-all;text-align:center}

/* QR 크게 보기 */
.bigqr{position:fixed;inset:0;z-index:7;display:grid;place-items:center;align-content:center;gap:clamp(12px,2vh,28px);padding:24px;background:var(--sky-bg);text-align:center;cursor:pointer}
.bigqr .eyebrow{font-size:clamp(14px,1.4vw,26px);justify-self:center}
.bigqr h2{margin:0;font:700 clamp(26px,3.4vw,60px)/1.15 var(--f-display);color:var(--paper);text-wrap:balance}
.bigqr .frame{background:#ffffff;border-radius:18px;padding:clamp(12px,1.6vh,24px);box-shadow:0 0 0 1px var(--line),0 20px 60px var(--shadow),0 0 90px var(--halo)}
.bigqr canvas{display:block;width:min(56vh,70vw);height:auto;aspect-ratio:1}
.bigqr p{margin:0;font:500 clamp(15px,1.5vw,28px)/1.4 var(--f-ui);color:var(--mist)}

.wall-note{
  position:absolute;z-index:3;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + clamp(40px,3.6vw,64px));
  width:min(1100px,calc(100% - 2 * var(--gutter)));margin:0;pointer-events:none;
  text-align:center;font:500 clamp(11px,.82vw,15px)/1.6 var(--f-ui);color:var(--mist);word-break:keep-all;white-space:pre-line;
  transition:color .8s ease,opacity .8s ease;
}
.foot{
  position:absolute;left:0;right:0;bottom:0;z-index:3;
  display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 16px;
  padding:12px var(--gutter) calc(env(safe-area-inset-bottom,0px) + 14px);
  font:500 clamp(11px,.85vw,15px)/1.3 var(--f-ui);color:var(--mist);
  font-variant-numeric:tabular-nums;pointer-events:none;
}
.foot b{color:var(--paper);font-weight:600}
.conn{display:inline-flex;align-items:center;gap:7px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--mist)}
.conn[data-state="live"] i{background:var(--ok)}
.conn[data-state="down"] i{background:var(--danger)}
.conn[data-state="down"]{color:var(--danger)}

.empty{
  position:absolute;inset:0;z-index:1;display:grid;place-items:center;pointer-events:none;
  padding:0 18%;text-align:center;
  font:700 clamp(22px,2.4vw,44px)/1.3 var(--f-note);color:var(--mist);opacity:.6;
}

/* 쪽지 */
.card{position:absolute;width:clamp(150px,16vw,300px);transform:translate(-50%,-50%)}
.rise{animation:rise 1.9s cubic-bezier(.16,.84,.24,1) both}
.card.leaving .rise{animation:leave 1.4s ease-in forwards}
.bob{animation:bob var(--bd,6s) ease-in-out var(--bdl,0s) infinite alternate}
.card .note{padding:clamp(14px,1.2vw,22px) clamp(14px,1.3vw,24px) clamp(12px,1vw,18px)}
.card .note p{font-size:clamp(18px,1.75vw,33px)}
.card .note figcaption{font-size:clamp(11px,.8vw,14px)}
.card .note .kind-tag{font-size:clamp(11px,.75vw,14px)}
.card .note.fresh{animation:fresh 4.5s ease-out}
.card .note,.card .note figcaption,.card .note .kind-tag{transition:background-color .8s ease,box-shadow .8s ease,color .8s ease}
.card .note::before{transition:opacity .8s ease}

/* ---------- 전체 화면 공지 ---------- */
:root{--f-notice:var(--f-display)}
.theme-smc{--f-notice:var(--f-brand)}
.notice-bg{position:absolute;inset:0;z-index:1;background:var(--nb,var(--notice-blue));opacity:0;transition:opacity .8s ease;pointer-events:none}
.notice{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  display:grid;justify-items:center;align-content:center;gap:clamp(14px,2.4vh,30px);
  padding:10vh 12vw;text-align:center;opacity:0;transform:scale(.985);transition:opacity .8s ease,transform .8s ease;
}
.notice .eyebrow{font-size:clamp(13px,1.15vw,22px);justify-self:center}
.notice-text{
  margin:0;max-width:min(1500px,100%);color:var(--nt,#fff);
  font:700 clamp(32px,4.4vw,92px)/1.32 var(--f-notice);
  white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance;
  text-shadow:0 2px 28px rgba(0,0,0,.18);
}
body.has-notice .notice-bg{opacity:1}
body.has-notice .notice{opacity:1;transform:none}
body.has-notice .masthead,body.has-notice .empty{opacity:0}
body.has-notice .qr{opacity:0;visibility:hidden}
.q-mark{color:var(--glow);margin-right:.32em}
body[data-notice="amber"] .q-mark,body[data-notice="cream"] .q-mark{color:var(--samsung-blue)}
.masthead,.empty{transition:opacity .6s ease}
body.has-notice .foot,body.has-notice .foot b{color:var(--nt,#fff)}
body.has-notice .foot{opacity:.75}
body.has-notice .wall-note{color:var(--nt,#fff);opacity:.7}
body.has-notice .conn i{background:currentColor}
/* 공지가 떠 있는 동안 다른 쪽지는 테두리 없이 투명하게 */
body.has-notice .card .note{background:transparent;box-shadow:none;color:var(--ghost)}
body.has-notice .card .note figcaption{color:var(--ghost)}
body.has-notice .card .note .kind-tag{background:transparent;color:var(--ghost);box-shadow:inset 0 0 0 1px var(--ghost)}
body.has-notice .card .note::before{opacity:0}
body.has-notice .card .note.fresh{animation:none}
.card.pinned .note::before{background:var(--glow);opacity:.9}
@keyframes rise{from{transform:translateY(var(--rise,60vh)) scale(.9);opacity:0}22%{opacity:1}to{transform:none;opacity:1}}
@keyframes leave{to{transform:translateY(-70px) scale(.96);opacity:0}}
@keyframes bob{from{transform:translate(-4px,-7px) rotate(-.9deg)}to{transform:translate(4px,7px) rotate(.9deg)}}
@keyframes fresh{
  0%{box-shadow:0 14px 34px var(--shadow),0 0 0 3px var(--glow),0 0 90px var(--halo-strong)}
  100%{box-shadow:0 14px 34px var(--shadow),0 0 0 0 var(--glow),0 0 46px var(--halo)}
}

/* 마우스를 움직이면 나타나는 조작 막대 */
.ctrl{
  position:fixed;z-index:8;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 52px);
  max-width:calc(100% - 32px);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;
  padding:8px;background:var(--dock);border:1px solid var(--line);border-radius:14px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .4s;
}
.ctrl .hint{font:500 12px/1.3 var(--f-ui);color:var(--mist);padding:0 6px}
body.idle .ctrl{opacity:0;pointer-events:none}
body.fs .ctrl{display:none}

.ov-pw{display:flex;gap:8px}
.ov-pw input{flex:1;min-width:0;background:var(--field);color:var(--ink);border:1px solid var(--field-line);border-radius:9px;padding:10px 12px;font:400 16px/1.2 var(--f-ui)}
.setup #overlay-login{background:transparent;color:var(--ink);border-color:var(--field-line)}
.overlay{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:16px;background:var(--scrim)}

@media (max-width:560px){
  .masthead{max-width:62%}
  .card{width:clamp(132px,42vw,200px)}
  .card .note p{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  .bob{animation:none}
  .rise{animation:fade .6s ease both}
  .card.leaving .rise{animation:fadeout .6s ease forwards}
  .card .note.fresh{animation:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes fadeout{to{opacity:0}}
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="sky" aria-hidden="true"></canvas>

  <header class="masthead">
    <div class="brand-row">
      <span class="eyebrow" data-text="eyebrow">SKKU 정보통신대학원</span>
      <span class="logo-box" hidden><img data-logo="logo" alt=""></span>
    </div>
    <h1 class="title" data-text="title">올해의 한마디</h1>
    <p class="sub" data-text="wallSubtitle">QR을 찍고 메시지를 보내면 이 화면에 떠올라요</p>
  </header>

  <div class="qr" id="qr-box" role="img" aria-label="메시지 보내기 QR 코드">
    <canvas id="qr" aria-hidden="true"></canvas>
    <span>QR을 찍어 주세요</span>
  </div>

  <div class="notice-bg" aria-hidden="true"></div>
  <div class="empty" id="empty" data-text="emptyWall">첫 메시지를 기다리고 있어요</div>
  <div class="layer" id="layer" aria-label="메시지 월"></div>
  <div class="notice" id="notice" role="status" aria-live="polite" hidden>
    <span class="eyebrow" data-text="eyebrow">SKKU 정보통신대학원</span>
    <p class="notice-text" id="notice-text"><span class="q-mark" id="notice-q" hidden>Q.</span><span id="notice-body"></span></p>
  </div>

  <p class="wall-note" id="wall-note" hidden></p>
  <div class="corner-logo logo-box" id="corner-logo" hidden><img data-logo="bottomLogo" alt=""></div>
  <footer class="foot">
    <span><span class="conn" id="conn" data-state="wait"><i></i><span id="conn-text">연결 중…</span></span> · 화면 송출 메시지 <b id="count-now">0</b>개 · 누적 메시지 <b id="count-total">0</b>개</span>
    <span id="foot-life">메시지는 2분 동안 머물러요</span>
  </footer>
</main>

<div class="bigqr" id="bigqr" hidden>
  <span class="eyebrow" data-text="eyebrow">SKKU 정보통신대학원</span>
  <h2 data-text="title">올해의 한마디</h2>
  <div class="frame"><canvas id="bigqr-canvas" aria-label="메시지 보내기 QR 코드"></canvas></div>
  <p>휴대폰 카메라로 QR을 찍어 주세요</p>
</div>

<nav class="ctrl" id="ctrl" aria-label="화면 조작">
  <button class="btn primary" type="button" id="btn-full">전체화면</button>
  <button class="btn" type="button" id="btn-bigqr">QR 크게 보기</button>
  <span class="hint">F: 전체화면 · Q: QR 크게 보기 · 마우스를 가만히 두면 이 막대가 숨어요</span>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="overlay" id="overlay" hidden>
  <div class="setup">
    <h2 id="overlay-title">설정이 필요해요</h2>
    <p id="overlay-msg"><code>config.js</code> 파일에 Firebase 설정을 붙여넣으면 메시지월이 시작돼요.</p>
    <form class="ov-pw" id="overlay-pw" hidden novalidate>
      <input id="overlay-pw-input" type="password" autocomplete="current-password" placeholder="운영 비밀번호" aria-label="운영 비밀번호">
      <button class="btn primary" type="submit">들어가기</button>
    </form>
    <button class="btn primary" type="button" id="overlay-login" hidden>구글 계정으로 로그인</button>
  </div>
</div>

<script>
  setTimeout(function () {
    if (window.__wallReady) return;
    document.getElementById("overlay").hidden = false;
    document.getElementById("overlay-title").textContent = "불러오지 못했어요";
    document.getElementById("overlay-msg").textContent = "인터넷 연결을 확인하고 새로고침(F5)해 주세요.";
  }, 12000);
</script>
<script type="module">
import { EVENT } from "./config.js?v=20261007r";
import { configured, app, db, SDK, collection, query, where, orderBy, limit, onSnapshot, getCountFromServer } from "./firebase.js?v=20261007r";
import { applyText, applyTheme, applyLogos, fill, participantUrl, drawQR, makeToast, COL, SHOW_MAX, NOTICE_COLORS, OPERATOR_EMAIL, authErrorText, kindIndex } from "./shared.js?v=20261007r";

window.__wallReady = true;
applyTheme();
applyText();
document.title = (EVENT.title || "메시지월") + " · 메시지월";

const LIFETIME = Math.max(15, Number(EVENT.lifetimeSeconds) || 120) * 1000;
const COLORS = ["cream", "apricot", "mint", "sky", "lilac"];

const $ = (id) => document.getElementById(id);
const body = document.body;
const stage = $("stage"), layer = $("layer");
const masthead = document.querySelector(".masthead");
const qrBox = $("qr-box");
const foot = document.querySelector(".foot");
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
const toast = makeToast($("toast"));
const rand = (a, b) => a + Math.random() * (b - a);

applyLogos();
$("foot-life").textContent = fill(typeof EVENT.wallFootRight === "string" && EVENT.wallFootRight.trim() ? EVENT.wallFootRight : "메시지는 {시간} 동안 머물러요");
if (typeof EVENT.wallNote === "string" && EVENT.wallNote.trim()) {
  $("wall-note").textContent = EVENT.wallNote.trim();
  $("wall-note").hidden = false;
}
{
  const q = Math.max(80, Math.min(480, Number(EVENT.qrSize) || 170));
  document.documentElement.style.setProperty("--qr-w", `clamp(${Math.round(q * 0.5)}px, ${(q / 19.2).toFixed(2)}vw, ${q}px)`);
  document.documentElement.style.setProperty("--qr-label", `clamp(11px, ${(q / 210).toFixed(2)}vw, ${Math.round(q / 11)}px)`);
}
$("overlay").hidden = true;

// ---------- QR ----------
function paintBigQR() {
  if (!$("bigqr").hidden) drawQR($("bigqr-canvas"), participantUrl(), { pixels: 1400, light: "#ffffff" });
}
function toggleBigQR(force) {
  const show = typeof force === "boolean" ? force : $("bigqr").hidden;
  $("bigqr").hidden = !show;
  $("btn-bigqr").textContent = show ? "QR 닫기" : "QR 크게 보기";
  paintBigQR();
}
$("btn-bigqr").addEventListener("click", () => toggleBigQR());
$("bigqr").addEventListener("click", () => toggleBigQR(false));

function paintQR() {
  const ok = drawQR($("qr"), participantUrl(), { light: "#ffffff" });
  if (!ok && !qrBox.querySelector(".qr-fallback")) {
    $("qr").hidden = true;
    const s = document.createElement("span");
    s.className = "qr-fallback";
    s.textContent = participantUrl();
    qrBox.prepend(s);
  }
}

// ---------- 쪽지 배치 ----------
const cards = new Map(); // id -> card
let shownTotal = 0;

function liveCards() {
  return [...cards.values()].filter((c) => !c.leaving);
}

function bounds(cw, ch) {
  const W = stage.clientWidth, H = stage.clientHeight;
  const topBand = Math.max(masthead.getBoundingClientRect().bottom, qrBox.getBoundingClientRect().bottom) + 18;
  let bottomEdge = foot.getBoundingClientRect().top;
  for (const el of [$("wall-note"), $("corner-logo")]) {
    if (!el.hidden) bottomEdge = Math.min(bottomEdge, el.getBoundingClientRect().top);
  }
  const bottomLimit = bottomEdge - 10;
  const pad = Math.max(18, W * 0.03);
  let xMin = (pad + cw / 2) / W, xMax = 1 - xMin;
  let yMin = (topBand + ch / 2) / H, yMax = (bottomLimit - ch / 2) / H;
  if (xMin > xMax) xMin = xMax = 0.5;
  if (yMin > yMax) { const m = Math.min(Math.max((yMin + yMax) / 2, 0.3), 0.7); yMin = yMax = m; }
  return { W, H, xMin, xMax, yMin, yMax };
}

function pickSpot(cw, ch) {
  const b = bounds(cw, ch);
  let best = { fx: (b.xMin + b.xMax) / 2, fy: (b.yMin + b.yMax) / 2 }, bestScore = -1;
  for (let i = 0; i < 40; i++) {
    const fx = rand(b.xMin, b.xMax), fy = rand(b.yMin, b.yMax);
    let score = Infinity;
    for (const c of liveCards()) {
      const dx = (fx - c.fx) * b.W / ((cw + c.w) / 2);
      const dy = (fy - c.fy) * b.H / ((ch + c.h) / 2);
      score = Math.min(score, Math.hypot(dx, dy));
    }
    if (score > bestScore) { bestScore = score; best = { fx, fy }; }
  }
  return best;
}

function capacity() {
  const W = stage.clientWidth, H = stage.clientHeight;
  const cw = Math.min(300, Math.max(150, W * 0.16)), ch = cw * 0.62;
  return Math.max(5, Math.min(20, Math.floor((W * H * 0.6) / (cw * ch * 1.35))));
}

function updateCounts() {
  const n = liveCards().length;
  $("count-now").textContent = n;
  $("empty").hidden = n > 0;
}

function retire(card) {
  if (!card || card.leaving) return;
  card.leaving = true;
  clearTimeout(card.timer);
  card.el.classList.add("leaving");
  updateCounts();
  setTimeout(() => {
    card.el.remove();
    if (cards.get(card.id) === card) cards.delete(card.id);
  }, reduce.matches ? 650 : 1450);
}

// 운영진이 고친 문구가 있으면 그걸, 없으면 원문을 보여줘요
function shownOf(msg) {
  const t = typeof msg.shownText === "string" && msg.shownText ? msg.shownText : msg.text;
  return String(t || "").slice(0, SHOW_MAX);
}

// 떠 있는 쪽지의 문구가 바뀌면 그 자리에서 바로 바꿔요
function refreshText(id, msg) {
  const card = cards.get(id);
  if (!card || card.leaving) return;
  const next = shownOf(msg);
  if (card.textEl.textContent === next) return;
  card.textEl.textContent = next;
  const note = card.el.querySelector(".note");
  note.classList.remove("fresh");
  void note.offsetWidth;
  note.classList.add("fresh");
}

function spawn(id, msg, life, fresh) {
  if (cards.has(id)) retire(cards.get(id));
  const live = liveCards().sort((a, b) => a.born - b.born);
  if (live.length >= capacity()) retire(live.find((c) => !c.pinned) || live[0]); // 고정된 쪽지는 최대한 남겨요

  const el = document.createElement("div");
  el.className = "card";
  el.style.visibility = "hidden";
  el.innerHTML = '<div class="rise"><div class="bob"><figure class="note"><p></p><figcaption></figcaption></figure></div></div>';
  const note = el.querySelector(".note");
  if (msg.kind) {
    const tag = document.createElement("span");
    const ki = kindIndex(msg.kind);
    tag.className = "kind-tag" + (ki >= 0 && ki < 3 ? " k" + ki : "");
    tag.textContent = String(msg.kind).slice(0, 20);
    note.prepend(tag);
  }
  const textEl = note.querySelector("p");
  textEl.textContent = shownOf(msg);
  note.querySelector("figcaption").textContent = "— " + (String(msg.name || "").slice(0, 12) || "익명");
  const color = COLORS.includes(msg.color) ? msg.color : "cream";
  note.style.setProperty("--c", `var(--note-${color})`);
  note.style.setProperty("--rot", rand(-3, 3).toFixed(2) + "deg");
  const bob = el.querySelector(".bob");
  bob.style.setProperty("--bd", rand(5, 8.5).toFixed(2) + "s");
  bob.style.setProperty("--bdl", (-rand(0, 6)).toFixed(2) + "s");
  layer.appendChild(el);

  const cw = el.offsetWidth, ch = el.offsetHeight;
  const spot = pickSpot(cw, ch);
  el.style.left = (spot.fx * 100).toFixed(3) + "%";
  el.style.top = (spot.fy * 100).toFixed(3) + "%";
  el.style.setProperty("--rise", Math.round(stage.clientHeight * (1 - spot.fy) + ch) + "px");
  if (fresh) note.classList.add("fresh");
  el.style.visibility = "";

  const pinned = !Number.isFinite(life);
  if (pinned) el.classList.add("pinned");
  const card = { id, el, textEl, fx: spot.fx, fy: spot.fy, w: cw, h: ch, born: Date.now(), leaving: false, pinned };
  if (!pinned) card.timer = setTimeout(() => retire(card), life);
  cards.set(id, card);
  shownTotal++;
  updateCounts();
}

// ---------- 실시간 연결 ----------
const handled = new Set(); // "문서id:띄운시각" — 같은 메시지를 두 번 띄우지 않게
let first = true;

function setConn(state, text) {
  $("conn").dataset.state = state;
  $("conn-text").textContent = text;
}

// 누적 개수: 새 메시지가 오면 바로 +1, 서버 숫자로는 15초에 한 번만 맞춰요
let total = 0, syncTimer = null;
function showTotal() { $("count-total").textContent = total; }
function syncTotal() {
  getCountFromServer(query(collection(db, COL), where("status", "==", "live")))
    .then((s) => { total = s.data().count; showTotal(); })
    .catch(() => {});
}
function scheduleSync() {
  if (syncTimer) return;
  syncTimer = setTimeout(() => { syncTimer = null; syncTotal(); }, 15000);
}

// ---------- 전체 화면 공지 ----------
let notice = null; // { id, timer }
function showNotice(id, d, life) {
  if (notice) clearTimeout(notice.timer);
  body.dataset.notice = NOTICE_COLORS.includes(d.noticeColor) ? d.noticeColor : "blue";
  $("notice-body").textContent = shownOf(d);
  $("notice-q").hidden = d.noticeType !== "qna";
  const el = $("notice");
  el.hidden = false;
  void el.offsetWidth; // 숨김을 푼 뒤 한 박자 쉬고 서서히 나타나게
  body.classList.add("has-notice");
  notice = { id, timer: Number.isFinite(life) ? setTimeout(() => clearNotice(id), life) : null };
}
function clearNotice(id) {
  if (!notice || (id && notice.id !== id)) return;
  clearTimeout(notice.timer);
  notice = null;
  body.classList.remove("has-notice");
  setTimeout(() => {
    if (notice) return;
    $("notice").hidden = true;
    delete body.dataset.notice;
  }, 900);
}

let started = false;
function start() {
  if (started) return;
  started = true;
  const q = query(collection(db, COL), orderBy("liveAt", "desc"), limit(40));
  onSnapshot(q, { includeMetadataChanges: true }, (snap) => {
    setConn(snap.metadata.fromCache ? "wait" : "live", snap.metadata.fromCache ? "다시 연결 중…" : "실시간 연결됨");
    const changes = snap.docChanges();
    const arrivals = [];
    let noticeIn = null; // 이번에 새로 뜰 공지 (가장 최근 것)
    for (const ch of changes) {
      const d = ch.doc.data();
      const id = ch.doc.id;
      if (ch.type === "removed") { retire(cards.get(id)); clearNotice(id); continue; }
      if (d.status !== "live" || !d.liveAt) { retire(cards.get(id)); clearNotice(id); continue; }
      const key = id + ":" + d.liveAt.toMillis();
      if (handled.has(key)) {
        refreshText(id, d);
        if (notice && notice.id === id) $("notice-body").textContent = shownOf(d);
        continue;
      }
      handled.add(key);
      // 운영진이 정한 머무는 시간 (0이면 숨길 때까지 고정)
      const stayMs = typeof d.stay === "number" ? (d.stay === 0 ? Infinity : Math.max(5, d.stay) * 1000) : LIFETIME;
      if (d.notice === true) {
        const age = Date.now() - d.liveAt.toMillis();
        const life = !first || stayMs === Infinity ? stayMs : stayMs - Math.max(0, age);
        if (life > 2000 && (!noticeIn || d.liveAt.toMillis() > noticeIn.d.liveAt.toMillis())) noticeIn = { id, d, life };
        continue;
      }
      if (first) {
        const age = Date.now() - d.liveAt.toMillis();
        if (stayMs === Infinity) arrivals.push({ id, d, life: Infinity, fresh: false });
        else if (age < stayMs - 4000) arrivals.push({ id, d, life: stayMs - Math.max(0, age), fresh: false });
      } else {
        arrivals.push({ id, d, life: stayMs, fresh: true });
      }
    }
    if (noticeIn) showNotice(noticeIn.id, noticeIn.d, noticeIn.life);
    // 오래된 것부터 띄우고, 여러 개면 조금씩 시간차를 둬요
    arrivals.reverse().forEach((a, i) => {
      setTimeout(() => spawn(a.id, a.d, a.life, a.fresh), first ? i * 350 : i * 600);
    });
    if (first) syncTotal();
    else if (arrivals.length) { total += arrivals.length; showTotal(); scheduleSync(); }
    if (!snap.metadata.fromCache) first = false; // 서버와 처음 맞춘 뒤부터 "새 메시지"로 취급
  }, (err) => {
    console.error(err);
    setConn("down", "연결 오류 — 새로고침해 주세요");
    if (err && err.code === "permission-denied") {
      $("overlay").hidden = false;
      $("overlay-title").textContent = "데이터를 읽을 수 없어요";
      $("overlay-msg").textContent = EVENT.privateRead
        ? "관리자로 등록된 구글 계정으로 로그인했는지, 보안 규칙이 게시됐는지 확인해 주세요."
        : "Firestore 보안 규칙이 게시됐는지 확인해 주세요.";
    }
  });
}

// ---------- 전체화면 / 화면 꺼짐 방지 / 마우스 숨김 ----------
const fullBtn = $("btn-full");
if (!document.fullscreenEnabled) fullBtn.hidden = true;
function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => toast("이 브라우저에서는 전체화면을 쓸 수 없어요"));
}
fullBtn.addEventListener("click", toggleFull);
document.addEventListener("fullscreenchange", () => {
  fullBtn.textContent = document.fullscreenElement ? "전체화면 끝내기" : "전체화면";
  body.classList.toggle("fs", Boolean(document.fullscreenElement)); // 전체화면에서는 조작 막대를 아예 숨겨요
});
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "f" || e.key === "F") toggleFull();
  else if (e.key === "q" || e.key === "Q") toggleBigQR();
  else if (e.key === "Escape" && !$("bigqr").hidden) toggleBigQR(false);
});

let wakeLock = null;
async function keepAwake() {
  try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
document.addEventListener("pointerdown", keepAwake);
keepAwake();

let idleTimer = null;
function wake() {
  body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => body.classList.add("idle"), 2500);
}
["mousemove", "pointerdown", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, wake, { passive: true }));
wake();

// ---------- 밤하늘 반짝이 ----------
const sky = $("sky"), ctx = sky.getContext("2d");
let parts = [], SW = 0, SH = 0;
const WARM = "240,180,106", COOL = "157,177,189";
function mk(anyY) {
  return { x: Math.random() * SW, y: anyY ? Math.random() * SH : SH + 10, r: rand(0.6, 2.6), v: rand(6, 20), a: rand(0.15, 0.6), tw: rand(0, 6.28), warm: Math.random() < 0.55 };
}
function sizeSky() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  SW = sky.clientWidth; SH = sky.clientHeight;
  sky.width = Math.round(SW * dpr); sky.height = Math.round(SH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  parts = Array.from({ length: Math.round(Math.min(110, (SW * SH) / 18000)) }, () => mk(true));
  drawSky(0);
}
function drawSky(dt) {
  ctx.clearRect(0, 0, SW, SH);
  for (const p of parts) {
    p.y -= p.v * dt; p.tw += dt * 1.3;
    if (p.y < -10) Object.assign(p, mk(false));
    const al = p.a * (0.65 + 0.35 * Math.sin(p.tw));
    ctx.fillStyle = `rgba(${p.warm ? WARM : COOL},${al.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
}
let last = 0;
function loop(t) {
  const dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
  last = t;
  if (!reduce.matches) drawSky(dt);
  requestAnimationFrame(loop);
}

// ---------- 시작 ----------
sizeSky();
paintQR();
window.addEventListener("resize", () => { sizeSky(); paintQR(); paintBigQR(); });
requestAnimationFrame(loop);
updateCounts();

if (!configured) {
  $("overlay").hidden = false;
  setConn("down", "설정 필요");
} else if (EVENT.privateRead) {
  // 병원 버전: 운영진 로그인 후에만 메시지를 불러와요
  setConn("wait", "로그인 확인 중…");
  const A = await import(SDK + "firebase-auth.js");
  const auth = A.getAuth(app);
  A.onAuthStateChanged(auth, (user) => {
    if (user) {
      $("overlay").hidden = true;
      start();
    } else if (!started) {
      $("overlay").hidden = false;
      $("overlay-title").textContent = "운영진 로그인이 필요해요";
      $("overlay-msg").textContent = OPERATOR_EMAIL
        ? "메시지는 운영진만 볼 수 있게 잠겨 있어요. 운영 비밀번호를 입력하거나 관리자 구글 계정으로 로그인해 주세요."
        : "메시지는 운영진만 볼 수 있게 잠겨 있어요. 관리자로 등록된 구글 계정으로 로그인해 주세요.";
      $("overlay-login").hidden = false;
      $("overlay-pw").hidden = !OPERATOR_EMAIL;
      setConn("wait", "로그인 필요");
    }
  });
  $("overlay-login").addEventListener("click", async () => {
    try { await A.signInWithPopup(auth, new A.GoogleAuthProvider()); }
    catch (e) { $("overlay-msg").textContent = authErrorText(e); }
  });
  $("overlay-pw").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const pw = $("overlay-pw-input").value;
    if (!pw) { $("overlay-msg").textContent = authErrorText({ code: "auth/missing-password" }); return; }
    try { await A.signInWithEmailAndPassword(auth, OPERATOR_EMAIL, pw); $("overlay-pw-input").value = ""; }
    catch (e) { $("overlay-msg").textContent = authErrorText(e); }
  });
} else {
  start();
}
</script>
</body>
